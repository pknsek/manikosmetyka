name: Deploy na dhosting (FTP)

# Po każdym pushu na main wgrywa pliki strony do public_html/ na dhosting.pl.
# Wymaga sekretów w repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (Settings -> Secrets and variables -> Actions).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "v1/**"
      - "generator.py"
      - "h*.png"
  workflow_dispatch:

concurrency:
  group: deploy-dhosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Przygotuj tylko pliki strony
        run: |
          mkdir dist
          cp ./*.html style.css fonts.css main.js dist/
          cp -r fonts img dist/
          echo "Pliki do wgrania:"; find dist -type f | wc -l

      - name: Wgraj na serwer FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./public_html/
